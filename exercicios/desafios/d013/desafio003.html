<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Notas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 600px;
            table-layout: fixed;
            margin-bottom: 20px;
            position: relative;
            border: 2px solid black;

        }
        
        th, td {
            border: 2px solid black;
            padding: 10px;
            box-sizing: border-box;
        }

        thead {
            background-color: rgb(136, 134, 134);
        }

        thead th {
            color: white;
        }

        /* Centralizar apenas as colunas notas */
        .notas {
            text-align: center;
        }
        
        tbody {
        text-align: left;
        }

        tbody td.nota {
        text-align: center !important;
        }

        /* Exatas e Humanas em negrito */
        tbody td[rowspan] {
            font-weight: bold;
        }

        /* Linhas de média com mesma cor do thead */
        .media {
            background-color: rgb(136, 134, 134);
            font-weight: bold;
            color: white;
        }

    </style>
</head>
<body>
    <table>
        <thead>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplina</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            <tr>
                <th class="nota">Nota 1</th>
                <th class="nota">Nota 2</th>
            </tr>
        </thead>
        <tbody>
        <tr>
            <td rowspan="4">Exatas</td>
            <td>Matemática</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
        </tr>
        <tr>
            <td>Biólogia</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
        </tr>
        <tr class="media">
            <th colspan="4" scope="row">Média de Exatas</th>
            <td class="nota">0.0</td>
        </tr>
        <tr>
            <td rowspan="2">Humanas</td>
            <td>História</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
        </tr>
        <tr class="media">
            <th colspan="4" scope="row">Média de Humanas</th>
            <td class="nota">0.0</td>
        </tbody>
    </table>
</body>
</html>
