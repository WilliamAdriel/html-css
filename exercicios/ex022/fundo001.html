<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Quadrados</title>
    <style>

        body {
            background-image: url('imagens/wallpaper001.jpg');
        }

        
        div.quadrado {
            display: inline-block;
            border: 2px solid black;
            border-radius: 10px;
            background-color: lightgray;
            width: 300px;
            height: 300px;
        }

        div#q1 {
            background-color: skyblue;
        }

        div#q2 {
            background-image: linear-gradient(to bottom, yellow, red);
        }

        div#q3 {
            background-image: url('imagens/pattern003.png');
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td><div class="quadrado" id="q1"></div></td>
            <td><div class="quadrado" id="q2"></div></td>
            <td><div class="quadrado" id="q3"></div></td>
        </tr>
    </table>
</body>
</html>
